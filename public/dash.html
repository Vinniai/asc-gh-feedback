<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — AppShake</title>
<link rel="stylesheet" href="styles.css">
<style>
  .top { display: flex; align-items: center; gap: 10px; }
  .top img { width: 30px; height: 30px; border-radius: 999px; }
  .top .who { font-size: 13.5px; color: var(--muted-foreground); }
  .top a.out { font-size: 12.5px; color: var(--muted-foreground); }
  .signin { text-align: center; padding: 100px 0; }
  .signin h1 { font-size: 30px; letter-spacing: -.02em; margin-bottom: 10px; }
  .signin p { color: var(--muted-foreground); margin-bottom: 26px; }
  .empty { text-align: center; padding: 60px 0; color: var(--muted-foreground); }
  .claim { display: flex; gap: 8px; margin-top: 30px; max-width: 420px; margin-left: auto; margin-right: auto; }
  .cat-i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 700 10.5px var(--font-mono); color: #fff; font-style: normal; flex: 0 0 auto; }
  .apps-grid { display: grid; gap: 10px; margin-top: 24px; }
  .acc { overflow: hidden; }
  .acc-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px; background: none; border: 0; color: var(--foreground); cursor: pointer; text-align: left; font: inherit; }
  .acc-ico { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); display: grid; place-items: center; font: 700 13px var(--font-sans); flex: 0 0 auto; }
  .acc-main { flex: 1; min-width: 0; }
  .acc-main b { font-size: 15px; display: block; }
  .acc-sub { font-size: 12.5px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc-sub .gh-mini { width: 14px; height: 14px; border-radius: 4px; background: #24292f; color: #fff; font: 700 7.5px var(--font-mono); display: inline-grid; place-items: center; flex: 0 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto; }
  .dot.on { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 25%, transparent); }
  .dot.off { background: var(--muted-foreground); }
  .acc-state { font-size: 12.5px; color: var(--muted-foreground); }
  .chev { color: var(--muted-foreground); transition: transform .25s var(--ease-out-quart); flex: 0 0 auto; }
  .acc[data-open] .chev { transform: rotate(180deg); }
  .acc-body { border-top: 1px solid transparent; padding: 0 18px; }
  .acc[data-open] .acc-body { border-top-color: var(--border); padding: 16px 18px 18px; transition: padding 250ms var(--ease-out); }
  .sec { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .sec > summary::-webkit-details-marker { display: none }
  .sec > summary .badge { margin-left: auto; }
  .sec-body { padding: 2px 14px 14px; }
  .drow { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
  .drow + .drow { border-top: 1px solid var(--border); }
  .drow .cat-i { width: 26px; height: 26px; border-radius: 7px; }
  .drow input { flex: 1; min-width: 0; background: var(--background); color: var(--foreground); border: 1px solid var(--input); border-radius: 8px; padding: 7px 10px; font: 12.5px var(--font-mono); }
  .drow .rm { background: none; border: 0; color: var(--muted-foreground); font-size: 16px; cursor: pointer; padding: 4px; }
  .drow .rm:hover { color: var(--destructive); }
  .addmenu { position: relative; margin-top: 10px; }
  .addmenu-list { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 230px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 16px 40px rgb(0 0 0 / .35); padding: 6px; }
  .addmenu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; color: var(--foreground); font: 13.5px var(--font-sans); border-radius: 8px; cursor: pointer; text-align: left; }
  .addmenu-item:hover:not(:disabled) { background: var(--muted); }
  .addmenu-item:disabled { opacity: .5; cursor: not-allowed; }
  .addmenu-item .badge { margin-left: auto; }
  .savebar { position: sticky; bottom: 10px; display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--primary) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent); animation: pop .25s var(--ease-out-quart); }
  .savebar span { font-size: 13px; flex: 1; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) } to { opacity: 1 } }
  .mini { font-size: 12.5px; padding: 8px 12px !important; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick a { font-size: 12.5px; color: var(--primary); text-decoration: none; border: 1px solid var(--border); padding: 5px 12px; border-radius: 999px; }
  .quick a:hover { background: var(--muted); }
  .row2 { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 13.5px; }
  .danger-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .pause { font-size: 12.5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer; }
  .deliv-out { font: 11.5px var(--font-mono); color: var(--muted-foreground); margin-top: 10px; white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
  .guide { margin-top: 12px; font-size: 13px; color: var(--muted-foreground); }
  .guide summary { cursor: pointer; font-weight: 600; color: var(--foreground); list-style: none; }
  .guide ol { margin: 10px 0 0 18px; padding: 0; }
  .guide li { margin: 6px 0; }
  .guide a { color: var(--primary); }
  .prompt-t { width: 100%; margin-top: 10px; background: var(--background); color: var(--muted-foreground); border: 1px solid var(--input); border-radius: 8px; padding: 10px; font: 11.5px/1.6 var(--font-mono); resize: vertical; }
  .save-msg { font-size: 12.5px; }
  @media (max-width: 640px) {
    .container { padding: 0 12px; }
    .acc-head { padding: 14px; }
    .acc-body { padding: 12px; }
    .acc-state { display: none; }
    .quick { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .quick a { flex: 0 0 auto; }
  }
  dialog#wiz { margin: auto; width: min(560px, calc(100vw - 24px)); border: 1px solid var(--border); border-radius: 16px; background: var(--card); color: var(--foreground); padding: 0; }
  dialog#wiz::backdrop { background: rgb(0 0 0 / .55); backdrop-filter: blur(4px); }
  .wiz-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0; }
  .wiz-x { background: none; border: 0; color: var(--muted-foreground); font-size: 22px; cursor: pointer; line-height: 1; }
  .wiz-steps { display: flex; gap: 6px; }
  .wiz-steps i { width: 26px; height: 4px; border-radius: 2px; background: var(--border); transition: background .2s var(--ease-out); }
  .wiz-steps i.on { background: var(--primary); }
  .wiz-body { padding: 10px 22px 6px; min-height: 220px; max-height: min(58vh, 480px); overflow-y: auto; }
  .wiz-foot { display: flex; gap: 10px; align-items: center; padding: 14px 22px 20px; }
  .wiz-body h3 { font-size: 18px; letter-spacing: -.01em; margin-top: 10px; }
  .wiz-body .hint { color: var(--muted-foreground); font-size: 13px; margin-top: 4px; }
  .wiz-ok { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; border-radius: var(--radius); background: color-mix(in srgb, var(--success) 10%, transparent); color: var(--success); font-size: 13.5px; }
  .wiz-apps { display: grid; gap: 8px; margin-top: 14px; }
  .wiz-app { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 14px; }
  .wiz-app:hover { border-color: var(--muted-foreground); }
  .wiz-app.sel { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .wiz-app .b { font: 11.5px var(--font-mono); color: var(--muted-foreground); }
  @media (max-width: 640px) { dialog#wiz { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; border: 0; margin: 0; } .wiz-body { max-height: none; flex: 1; } }
  [hidden] { display: none !important; }
  /* read-only destination rows */
  .drow.ro { cursor: default; }
  .drow .d-name { font-size: 13.5px; font-weight: 600; flex: 0 0 auto; }
  .drow .d-mask { flex: 1; min-width: 0; font: 12px var(--font-mono); color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .drow .ed { background: none; border: 0; color: var(--muted-foreground); cursor: pointer; font-size: 13px; padding: 4px; }
  .drow .ed:hover { color: var(--foreground); }

  /* label pills */
  .pillbox { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 9px; border: 1px solid var(--input); border-radius: var(--radius); background: var(--background); cursor: text; min-height: 40px; align-items: center; }
  .pillbox:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent); }
  .pill-tag { display: inline-flex; align-items: center; gap: 5px; font: 600 12px var(--font-mono); padding: 3px 6px 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--primary); animation: pill-in .15s var(--ease-out) both; }
  @keyframes pill-in { from { opacity: 0; transform: scale(.95) } }
  .pill-tag button { background: none; border: 0; color: inherit; cursor: pointer; font-size: 13px; padding: 0 2px; opacity: .7; }
  .pill-tag button:hover { opacity: 1; }
  .pill-in { flex: 1; min-width: 120px; background: none; border: 0; color: var(--foreground); font: 13px var(--font-mono); outline: none; padding: 4px 2px; }

  /* Motion (Emil pass): interruptible transitions, strong ease-out, ≤300ms */
  .acc-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 250ms var(--ease-out); }
  .acc[data-open] .acc-wrap { grid-template-rows: 1fr; }
  .acc-wrap > .acc-body { overflow: hidden; min-height: 0; }
  .chev { transition: transform 200ms var(--ease-out); }
  .sec .sec-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease-out); }
  .sec[open] .sec-wrap { grid-template-rows: 1fr; }
  .sec .sec-wrap > .sec-body { overflow: hidden; min-height: 0; }
  .addmenu-list { transform-origin: top left; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
  .addmenu-list[hidden] { display: block !important; opacity: 0; transform: scale(.96) translateY(-4px); pointer-events: none; }
  .savebar { transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
  .savebar[hidden] { display: flex !important; opacity: 0; transform: translateY(6px); pointer-events: none; }
  .pause { transition: transform 160ms var(--ease-out), background 150ms var(--ease-out); }
  .pause:active { transform: scale(.97); }
  dialog#wiz { opacity: 1; transform: none; transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out); }
  @starting-style { dialog#wiz[open] { opacity: 0; transform: scale(.97) translateY(8px); } }
  dialog#wiz::backdrop { transition: background 220ms var(--ease-out); }
  @starting-style { dialog#wiz[open]::backdrop { background: rgb(0 0 0 / 0); } }
  @media (prefers-reduced-motion: reduce) {
    .acc-wrap, .sec .sec-wrap, .chev, .addmenu-list, .savebar, dialog#wiz { transition: opacity 150ms ease !important; }
    .pill-tag { animation: none; }
    .pause:active, .btn:active { transform: none; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="nav">
    <a class="brand" href="/">App<span>Shake</span></a>
    <div class="top" id="top"><span class="who">Dashboard</span></div>
  </header>

  <div id="signin" class="signin" hidden>
    <h1>Manage your apps</h1>
    <p>Sign in to configure feedback pipelines, destinations, and triage for every app you've connected.</p>
    <a class="btn btn-primary btn-lg" id="signinbtn" href="/api/auth?action=login">Sign in with GitHub</a>
  </div>

  <div id="dash" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <h1 style="font-size:24px;letter-spacing:-.02em">Your apps</h1>
      <button class="btn btn-primary" id="addapp">+ Connect an app</button>
    </div>
    <div class="apps-grid" id="apps"></div>
    <div class="empty" id="empty" hidden>
      <p>No apps yet — connect your first one, or claim a tenant you created before signing in.</p>
      <button class="btn btn-primary" id="addapp2" style="margin-bottom:8px">+ Connect an app</button>
      <div class="claim">
        <input id="claimid" placeholder="tenant id (t…)" style="background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font:13px var(--font-mono);flex:1">
        <button class="btn btn-outline" id="claimbtn">Claim</button>
      </div>
    </div>
  </div>
</div>

<dialog id="wiz">
  <div class="wiz-head">
    <div class="wiz-steps" id="wizsteps"></div>
    <button class="wiz-x" id="wizclose" aria-label="Close">×</button>
  </div>
  <div class="wiz-body" id="wizbody"></div>
  <div class="wiz-foot">
    <button class="btn btn-outline" id="wizback" hidden>Back</button>
    <span style="flex:1"></span>
    <span class="save-msg" id="wizmsg"></span>
    <button class="btn btn-primary" id="wiznext">Continue</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id)
const api = async (method, url, body) => {
  const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  const j = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(j.error || res.status)
  return j
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

const DTYPES = { discord: ['DC','#5865F2','Discord','Discord → Server Settings → Integrations → Webhooks → Copy URL'], slack: ['SL','#611f69','Slack','Slack → api.slack.com/apps → Incoming Webhooks → Copy URL'], webhook: ['WH','#16a34a','Any webhook','Any HTTPS endpoint — we POST a JSON event per feedback'] }
const SOON = [['GL','#fc6d26','GitLab'],['LN','#5E6AD2','Linear'],['JR','#2684FF','Jira'],['NT','#37352f','Notion'],['TG','#229ED9','Telegram'],['MS','#6264A7','Teams']]

function card(t) {
  const el = document.createElement('section')
  el.className = 'card acc'
  el.dataset.id = t.tenantId
  let dests = [...(t.destinations || [])]

  const summaryLine = () => `<span class="gh-mini">GH</span> ${esc(t.repo)}${dests.length ? ` · +${dests.length} destination${dests.length > 1 ? 's' : ''}` : ''}`

  const maskUrl = (u) => { try { const x = new URL(u); return x.host + '/…' + u.replace(/\/+$/, '').slice(-5) } catch { return u.slice(0, 22) + '…' } }
  const destRows = () => dests.map((d, i) => {
    const [mono, color, name, hint] = DTYPES[d.type]
    return d.editing || !d.url
      ? `<div class="drow" data-i="${i}">
          <i class="cat-i" style="background:${color}">${mono}</i>
          <input class="d-url" placeholder="https://…" value="${esc(d.url)}" title="${esc(hint)}">
          <button class="rm" title="Remove ${name}">×</button>
        </div>`
      : `<div class="drow ro" data-i="${i}">
          <i class="cat-i" style="background:${color}">${mono}</i>
          <span class="d-name">${name}</span>
          <span class="d-mask" title="Click to edit">${esc(maskUrl(d.url))}</span>
          <span class="badge badge-success-light">on</span>
          <button class="ed" title="Edit URL">✎</button>
          <button class="rm" title="Remove ${name}">×</button>
        </div>`
  }).join('') || '<p style="font-size:12.5px;color:var(--muted-foreground);padding:6px 0">Only GitHub for now — add somewhere else below.</p>'

  el.innerHTML = `
    <button class="acc-head" aria-expanded="false">
      <span class="acc-ico">${esc((t.appName || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase())}</span>
      <span class="acc-main"><b>${esc(t.appName)}</b><span class="acc-sub" data-role="summary">${summaryLine()}</span></span>
      <span class="dot ${t.enabled ? 'on' : 'off'}" data-role="dot"></span>
      <span class="acc-state" data-role="state">${t.enabled ? 'Live' : 'Paused'}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="acc-wrap"><div class="acc-body">
      <div class="quick">
        <a href="${t.links.issues}" target="_blank" rel="noopener">GitHub issues ↗</a>
        <a href="${t.links.ascFeedback}" target="_blank" rel="noopener">ASC feedback ↗</a>
        <a href="${t.links.ascCrashes}" target="_blank" rel="noopener">ASC crashes ↗</a>
        <a href="${t.links.ascApp}" target="_blank" rel="noopener">TestFlight ↗</a>
      </div>

      <details class="sec" open>
        <summary><i class="cat-i" style="background:#24292f;width:22px;height:22px;font-size:9px">GH</i> Destinations <span class="badge badge-success-light">GitHub live</span></summary>
        <div class="sec-wrap"><div class="sec-body">
          <div data-role="drows">${destRows()}</div>
          <div class="addmenu">
            <button class="btn btn-outline mini" data-role="addbtn">+ Add destination</button>
            <div class="addmenu-list" data-role="addlist" hidden>
              ${Object.entries(DTYPES).map(([k, [mono, color, name]]) =>
                `<button class="addmenu-item" data-add="${k}"><i class="cat-i" style="background:${color};width:22px;height:22px;font-size:9px">${mono}</i>${name}</button>`).join('')}
              ${SOON.map(([mono, color, name]) =>
                `<button class="addmenu-item" disabled><i class="cat-i" style="background:${color};width:22px;height:22px;font-size:9px">${mono}</i>${name}<span class="badge badge-secondary">soon</span></button>`).join('')}
            </div>
          </div>
        </div></div>
      </details>

      <details class="sec">
        <summary>Pipeline & triage ${t.routineConfigured ? '<span class="badge badge-success-light">routine on</span>' : ''}</summary>
        <div class="sec-wrap"><div class="sec-body">
          <label class="row2"><input type="checkbox" class="switch" data-role="p-issue" ${t.pipeline.createIssue !== false ? 'checked' : ''}> Create GitHub issue</label>
          <label class="row2"><input type="checkbox" class="switch" data-role="p-routine" ${t.pipeline.fireRoutine !== false ? 'checked' : ''}> Fire Claude triage routine</label>
          <div class="field" style="margin-top:8px"><label>Labels</label>
            <div class="pillbox" data-role="labelbox"><input class="pill-in" data-role="labelin" placeholder="add label, press comma"></div>
          </div>
          <div class="routine-cfg" data-role="routinecfg" ${t.pipeline.fireRoutine !== false ? '' : 'hidden'}>
          <div class="grid-2">
            <div class="field"><label>Routine ID</label><input class="mini" data-role="rid" placeholder="trig_…"></div>
            <div class="field"><label>Routine token <span class="desc">write-only</span></label><input class="mini" type="password" data-role="rtok" placeholder="${t.routineConfigured ? '•••••• (set)' : 'sk-ant-oat01-…'}"></div>
          </div>
          <details class="guide">
            <summary>How to set up your Claude triage routine ▸</summary>
            <ol>
              <li>Open <a href="https://claude.ai/code/routines" target="_blank" rel="noopener">claude.ai/code/routines ↗</a> → New routine, connected to <b>${esc(t.repo)}</b></li>
              <li>Paste this prompt <button class="btn btn-outline mini" data-role="copyprompt">Copy</button></li>
              <li>Add trigger → API → Generate token (shown once)</li>
              <li>Paste id + token above, then Save</li>
            </ol>
            <textarea class="prompt-t" data-role="prompttext" readonly rows="4">You are the TestFlight feedback triage agent for this repo. A webhook files each TestFlight feedback/crash as a GitHub issue labeled testflight-feedback + needs-triage, with screenshots, device metadata, and crash logs embedded. The fire payload may include a specific issue URL — start there; otherwise list open issues with those labels. CLAIM-FIRST: re-read labels before analyzing; if needs-triage is gone, skip silently; claim by swapping needs-triage → triaged. Then: read the feedback and screenshots; find root cause in the code (crashes: read the stack); comment analysis with file/line refs, severity, fix suggestion; label type + priority P0-P3; open a fix PR for small confident fixes; dedupe and link duplicates. Never close a feedback issue without a fix PR or duplicate link.</textarea>
          </details>
          </div>
        </div></div>
      </details>

      <details class="sec">
        <summary>History</summary>
        <div class="sec-wrap"><div class="sec-body">
          <div style="display:flex;gap:8px">
            <button class="btn btn-outline mini" data-role="activity">Activity</button>
            <button class="btn btn-outline mini" data-role="deliv">Apple deliveries</button>
          </div>
          <div class="deliv-out" data-role="delivout"></div>
        </div></div>
      </details>

      <div class="savebar" data-role="savebar" hidden>
        <span>Unsaved changes</span>
        <button class="btn btn-outline mini" data-role="discard">Discard</button>
        <button class="btn btn-primary mini" data-role="save">Save</button>
      </div>

      <div class="danger-row">
        <button class="pause" data-role="toggle">${t.enabled ? 'Pause' : 'Resume'}</button>
        <button class="pause" data-role="delete" style="color:var(--destructive)">Disconnect</button>
      </div>
    </div></div>`

  const q = (r) => el.querySelector(`[data-role="${r}"]`)
  const head = el.querySelector('.acc-head')
  head.onclick = () => {
    const open = !el.hasAttribute('data-open')
    document.querySelectorAll('.acc').forEach(a => { if (a !== el) { a.removeAttribute('data-open'); a.querySelector('.acc-head').setAttribute('aria-expanded', 'false') } })
    el.toggleAttribute('data-open', open)
    head.setAttribute('aria-expanded', String(open))
  }

  const markDirty = () => { q('savebar').hidden = false }
  const rerenderDests = () => {
    q('drows').innerHTML = destRows()
    wireDests()
    q('summary').innerHTML = summaryLine()
  }
  const wireDests = () => {
    q('drows').querySelectorAll('.drow').forEach(row => {
      const i = +row.dataset.i
      row.querySelector('.d-url')?.addEventListener('input', (e) => { dests[i].url = e.target.value.trim(); dests[i].editing = true; markDirty() })
      row.querySelector('.rm').onclick = () => { dests.splice(i, 1); rerenderDests(); markDirty() }
      const startEdit = () => { dests[i].editing = true; rerenderDests(); q('drows').querySelector(`.drow[data-i="${i}"] .d-url`)?.focus() }
      row.querySelector('.ed')?.addEventListener('click', startEdit)
      row.querySelector('.d-mask')?.addEventListener('click', startEdit)
    })
  }
  wireDests()

  q('addbtn').onclick = (e) => { e.stopPropagation(); q('addlist').hidden = !q('addlist').hidden }
  document.addEventListener('click', () => { const l = q('addlist'); if (l) l.hidden = true })
  q('addlist').querySelectorAll('[data-add]').forEach(b => b.onclick = (e) => {
    e.stopPropagation()
    dests.push({ type: b.dataset.add, url: '', editing: true })
    q('addlist').hidden = true
    rerenderDests(); markDirty()
    const inputs = q('drows').querySelectorAll('.d-url'); inputs[inputs.length - 1]?.focus()
  })

  let labels = (t.labels || '').split(',').map(x => x.trim()).filter(Boolean)
  const renderPills = () => {
    q('labelbox').querySelectorAll('.pill-tag').forEach(x => x.remove())
    labels.forEach((l, i) => {
      const sp = document.createElement('span')
      sp.className = 'pill-tag'
      sp.innerHTML = `${esc(l)}<button aria-label="Remove ${esc(l)}">×</button>`
      sp.querySelector('button').onclick = () => { labels.splice(i, 1); renderPills(); markDirty() }
      q('labelbox').insertBefore(sp, q('labelin'))
    })
  }
  renderPills()
  q('labelin').addEventListener('keydown', (e) => {
    if (e.key === ',' || e.key === 'Enter') {
      e.preventDefault()
      const v = q('labelin').value.replace(/,/g, '').trim()
      if (v && !labels.includes(v)) { labels.push(v); renderPills(); markDirty() }
      q('labelin').value = ''
    } else if (e.key === 'Backspace' && !q('labelin').value && labels.length) { labels.pop(); renderPills(); markDirty() }
  })
  q('labelbox').onclick = () => q('labelin').focus()

  ;['p-issue', 'p-routine', 'rid', 'rtok'].forEach(r => { q(r).addEventListener('input', markDirty); q(r).addEventListener('change', markDirty) })

  q('p-routine').addEventListener('change', () => { q('routinecfg').hidden = !q('p-routine').checked })

  q('discard').onclick = () => { dests = (t.destinations || []).map(d => ({ ...d })); rerenderDests(); labels = (t.labels || '').split(',').map(x => x.trim()).filter(Boolean); renderPills(); q('rid').value = ''; q('rtok').value = ''; q('p-issue').checked = t.pipeline.createIssue !== false; q('p-routine').checked = t.pipeline.fireRoutine !== false; q('savebar').hidden = true }

  q('save').onclick = async () => {
    const patch = {
      labels: labels.join(','),
      destinations: dests.filter(d => d.url).map(({ type, url }) => ({ type, url })),
      pipeline: { createIssue: q('p-issue').checked, fireRoutine: q('p-routine').checked }
    }
    if (q('rid').value.trim()) patch.routineId = q('rid').value.trim()
    if (q('rtok').value.trim()) patch.routineToken = q('rtok').value.trim()
    q('save').disabled = true; q('save').textContent = 'Saving…'
    try {
      const r = await api('POST', '/api/tenants', { tenantId: t.tenantId, patch })
      t.destinations = r.tenant.destinations; t.labels = r.tenant.labels; t.pipeline = r.tenant.pipeline
      dests = t.destinations.map(d => ({ ...d, editing: false }))
      rerenderDests()
      q('savebar').hidden = true
    } catch (e) { alert(e.message) }
    q('save').disabled = false; q('save').textContent = 'Save'
  }

  q('copyprompt')?.addEventListener('click', (ev) => {
    ev.preventDefault(); ev.stopPropagation()
    navigator.clipboard.writeText(q('prompttext').value)
    ev.target.textContent = '✓'
    setTimeout(() => { ev.target.textContent = 'Copy' }, 1500)
  })

  q('toggle').onclick = async () => {
    const enable = q('toggle').textContent === 'Resume'
    q('toggle').disabled = true
    try {
      await api('POST', '/api/tenants', { tenantId: t.tenantId, patch: { enabled: enable } })
      t.enabled = enable
      q('state').textContent = enable ? 'Live' : 'Paused'
      q('dot').className = `dot ${enable ? 'on' : 'off'}`
      q('toggle').textContent = enable ? 'Pause' : 'Resume'
    } catch (e) { alert(e.message) }
    q('toggle').disabled = false
  }

  q('delete').onclick = async () => {
    if (!confirm(`Disconnect ${t.appName}? The Apple webhook will be deleted. Issues already created stay.`)) return
    try { await api('DELETE', '/api/tenants', { tenantId: t.tenantId }); el.remove() } catch (e) { alert(e.message) }
  }

  q('activity').onclick = async () => {
    q('delivout').textContent = 'loading…'
    try {
      const r = await api('GET', `/api/tenants?logs=${t.tenantId}`)
      q('delivout').textContent = r.log.length
        ? r.log.map(e => `${e.t.slice(0, 19).replace('T', ' ')}  ${e.type}${e.by ? '  by ' + e.by : ''}${e.issueUrl ? '  ' + e.issueUrl : ''}${e.dest ? '  ' + e.dest : ''}${e.error ? '  ' + e.error : ''}`).join('\n')
        : 'No activity yet.'
    } catch (e) { q('delivout').textContent = e.message }
  }
  q('deliv').onclick = async () => {
    q('delivout').textContent = 'loading…'
    try {
      const r = await api('GET', `/api/tenants?deliveries=${t.tenantId}`)
      q('delivout').textContent = r.deliveries.length
        ? r.deliveries.map(d => `${d.createdDate}  ${d.deliveryState}  HTTP ${d.response?.httpStatusCode ?? '—'}`).join('\n')
        : 'No deliveries in the last hour.'
    } catch (e) { q('delivout').textContent = e.message }
  }

  return el
}


const wiz = { step: 0, data: {}, prefill: null }
const W = (id) => document.getElementById(id)

function wizSteps() {
  W('wizsteps').innerHTML = [0,1,2,3].map(i => `<i class="${i <= wiz.step ? 'on' : ''}"></i>`).join('')
  W('wizback').hidden = wiz.step === 0 || wiz.step === 3
}

function wizRender() {
  wizSteps()
  const b = W('wizbody'), next = W('wiznext')
  W('wizmsg').textContent = ''
  next.disabled = false
  if (wiz.step === 1) {
    const pf = wiz.prefill
    b.innerHTML = `<h3>Where should issues go?</h3>
      <p class="hint">Feedback becomes labeled GitHub issues in this repository.</p>
      ${pf?.hasGhToken
        ? `<div class="wiz-ok">✓ GitHub connected as ${esc(pf.login)}</div>
           <div class="field"><label>Repository</label><input id="wrepo" list="wrepos" placeholder="${pf.repos.length ? 'search your repositories…' : 'owner/repo'}" value="${esc(wiz.data.repo || '')}">
           <datalist id="wrepos">${pf.repos.map(r => `<option value="${esc(r)}">`).join('')}</datalist></div>`
        : `<div class="field" style="margin-top:16px"><a class="btn btn-primary btn-block" href="/api/auth?action=login">Re-connect GitHub to list your repositories</a></div>
           <p class="hint" style="margin-top:12px">Your sign-in predates repository access — one click re-connects it. Or paste a fine-grained PAT below.</p>
           <div class="field"><label>Personal access token <span class="desc">(alternative)</span></label><input id="wtoken" type="password" placeholder="github_pat_…"></div>
           <div class="field"><label>Repository</label><input id="wrepo" placeholder="owner/repo" value="${esc(wiz.data.repo || '')}"></div>`}`
    next.textContent = 'List my apps'
  }
  if (wiz.step === 0) {
    const pf = wiz.prefill
    if (pf?.hasCreds) {
      b.innerHTML = `<h3>App Store Connect</h3>
        <div class="wiz-ok">✓ Using your saved App Store Connect key</div>
        <p class="hint" style="margin-top:12px">The key from your existing app is reused — nothing to enter.</p>`
      wiz.data.useExisting = true
    } else {
      b.innerHTML = `<h3>App Store Connect key</h3>
        <p class="hint">Users and Access → Integrations → Team Keys (role: App Manager). <a href="https://appstoreconnect.apple.com/access/integrations/api" target="_blank" rel="noopener" style="color:var(--primary)">Open ASC ↗</a></p>
        <div class="grid-2"><div class="field"><label>Key ID</label><input id="wkeyid" value="${esc(wiz.data.ascKeyId || '')}"></div>
        <div class="field"><label>Issuer ID</label><input id="wissuer" value="${esc(wiz.data.ascIssuerId || '')}"></div></div>
        <div class="field"><label>Private key (.p8 contents)</label><textarea id="wp8" rows="4">${esc(wiz.data.ascPrivateKey || '')}</textarea></div>`
    }
    next.textContent = 'Continue'
  }
  if (wiz.step === 2) {
    b.innerHTML = `<h3>Pick the app to watch</h3>
      <p class="hint">We create the Apple webhook for it automatically.</p>
      <div class="wiz-apps">${wiz.data.apps.map(a =>
        `<div class="wiz-app ${wiz.data.appId === a.id ? 'sel' : ''}" data-id="${a.id}" role="radio" tabindex="0"><div><div>${esc(a.name)}</div><div class="b">${esc(a.bundleId)}</div></div></div>`).join('')}</div>`
    b.querySelectorAll('.wiz-app').forEach(el => el.onclick = () => {
      b.querySelectorAll('.wiz-app').forEach(x => x.classList.remove('sel'))
      el.classList.add('sel'); wiz.data.appId = el.dataset.id
      W('wiznext').disabled = false
    })
    next.textContent = 'Create webhook & go live'
    next.disabled = !wiz.data.appId
  }
  if (wiz.step === 3) {
    b.innerHTML = `<h3>You're live 🎉</h3>
      <div class="wiz-ok">✓ Webhook created on ${esc(wiz.data.result.app.name)}</div>
      <p class="hint" style="margin-top:12px">Endpoint: <span class="code">${esc(wiz.data.result.webhookUrl)}</span></p>
      <p class="hint">Watching Apple's delivery log for the test ping…</p>
      <div class="deliv-out" id="wdeliv">waiting…</div>`
    next.textContent = 'Done'
    wizPollDeliveries()
  }
}

async function wizPollDeliveries(tries = 0) {
  if (wiz.step !== 3 || tries > 10) return
  try {
    const r = await api('GET', `/api/tenants?deliveries=${wiz.data.result.tenantId}`)
    if (r.deliveries.length) {
      W('wdeliv').textContent = r.deliveries.map(d => `${d.createdDate}  ${d.deliveryState}  HTTP ${d.response?.httpStatusCode ?? '—'}`).join('\n')
      if (r.deliveries.some(d => d.deliveryState === 'SUCCEEDED')) return
    }
  } catch {}
  setTimeout(() => wizPollDeliveries(tries + 1), 4000)
}

async function wizNext() {
  const next = W('wiznext'), msg = W('wizmsg')
  msg.style.color = 'var(--destructive)'
  try {
    if (wiz.step === 0) {
      if (!wiz.data.useExisting) {
        wiz.data.ascKeyId = W('wkeyid').value.trim()
        wiz.data.ascIssuerId = W('wissuer').value.trim()
        wiz.data.ascPrivateKey = W('wp8').value.trim()
        if (!wiz.data.ascKeyId || !wiz.data.ascIssuerId || !wiz.data.ascPrivateKey) { msg.textContent = 'All three ASC fields are required'; return }
      }
      wiz.step = 1
    } else if (wiz.step === 1) {
      wiz.data.repo = W('wrepo')?.value.trim()
      wiz.data.githubToken = W('wtoken')?.value.trim() || ''
      if (!wiz.data.repo || !/\//.test(wiz.data.repo)) { msg.textContent = 'Pick a repository (owner/repo)'; return }
      next.disabled = true; next.textContent = 'Checking…'
      const r = await api('POST', '/api/setup', { action: 'validate', ...wiz.data })
      wiz.data.apps = r.apps
      wiz.step = 2
    } else if (wiz.step === 2) {
      if (!wiz.data.appId) { msg.textContent = 'Pick an app'; return }
      next.disabled = true; next.textContent = 'Creating webhook…'
      wiz.data.result = await api('POST', '/api/setup', { action: 'provision', ...wiz.data })
      wiz.step = 3
    } else {
      W('wiz').close(); location.reload(); return
    }
    wizRender()
  } catch (e) { msg.textContent = e.message; wizRender.call && wizSteps(); next.disabled = false; next.textContent = wiz.step === 1 ? 'List my apps' : 'Continue' }
}

async function openWiz() {
  wiz.step = 0; wiz.data = {}
  W('wiz').showModal()
  W('wizbody').innerHTML = '<p class="hint" style="margin-top:24px">Loading…</p>'
  try { wiz.prefill = await api('POST', '/api/setup', { action: 'prefill' }) } catch { wiz.prefill = null }
  wizRender()
}
W('wiznext').onclick = wizNext
W('wizback').onclick = () => { wiz.step = Math.max(0, wiz.step - 1); wizRender() }
W('wizclose').onclick = () => W('wiz').close()

async function load() {
  try {
    const me = await api('GET', '/api/auth?action=me')
    $('top').innerHTML = `<img src="${esc(me.user.avatar)}" alt=""><span class="who">${esc(me.user.login)}</span><a class="out" href="/api/auth?action=logout">Sign out</a>`
    $('dash').hidden = false
    document.getElementById('addapp').onclick = openWiz
    setTimeout(() => { const b2 = document.getElementById('addapp2'); if (b2) b2.onclick = openWiz }, 0)
    const { tenants } = await api('GET', '/api/tenants')
    if (!tenants.length) { $('empty').hidden = false }
    tenants.forEach(t => $('apps').appendChild(card(t)))
    if (new URLSearchParams(location.search).get('connect')) {
      history.replaceState(null, '', '/dash.html')
      openWiz()
    }
    $('claimbtn').onclick = async () => {
      try { await api('POST', '/api/tenants', { action: 'claim', tenantId: $('claimid').value.trim() }); location.reload() }
      catch (e) { alert(e.message) }
    }
  } catch {
    $('signin').hidden = false
    if (new URLSearchParams(location.search).get('connect')) {
      $('signinbtn').href = '/api/auth?action=login&next=' + encodeURIComponent('/dash.html?connect=1')
      document.querySelector('#signin p').textContent = 'One sign-in and your repositories are ready — then it\u2019s just your App Store Connect key and picking the app.'
    }
  }
}
load()
</script>
