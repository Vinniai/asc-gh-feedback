<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero prototypes — FeedbackLoop</title>
<style>
  /* Project tokens (from public/styles.css) */
  :root {
    --background: #0a0a0b; --foreground: #fafafa; --card: #131316;
    --muted: #1c1c21; --muted-foreground: #9d9da8;
    --primary: #6d86ff; --primary-foreground: #0a0a0b;
    --border: #26262c; --success: #4ade80; --destructive: #f87171;
    --radius: .625rem;
    --font-sans: -apple-system, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease-out-quart: cubic-bezier(.165, .84, .44, 1);
    --ease-spring: cubic-bezier(.175, .885, .32, 1.1);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--background); color: var(--foreground); font: 16px/1.6 var(--font-sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  #stage { min-height: 100vh; }
  .wrap { max-width: 1024px; margin: 0 auto; padding: 0 24px; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .brand { font-weight: 700; font-size: 17px; }
  .brand span { color: var(--primary); }
  .nav-fake { display: flex; gap: 20px; color: var(--muted-foreground); font-size: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: var(--radius); font: 600 15px var(--font-sans); text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: transform .15s var(--ease-out-quart), filter .15s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-outline { border-color: var(--border); color: var(--foreground); }
  .btn-outline:hover { background: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); filter: blur(5px) } to { opacity: 1; transform: none; filter: blur(0) } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.96); filter: blur(4px) } to { opacity: 1; transform: none; filter: blur(0) } }
  .rise { animation: rise .55s var(--ease-out-quart) both; }

  /* ---------- V1 Showroom ---------- */
  .v1-hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; padding: 56px 0; }
  @media (max-width: 880px) { .v1-hero { grid-template-columns: 1fr } }
  .v1-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-size: 13px; color: var(--muted-foreground); }
  .v1-pill b { background: var(--primary); color: var(--primary-foreground); font-size: 11px; border-radius: 999px; padding: 2px 8px; }
  .v1-hero h1 { font-size: clamp(34px, 4.6vw, 56px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; margin-top: 20px; }
  .v1-hero h1 em { font-style: normal; color: var(--primary); }
  .v1-sub { color: var(--muted-foreground); font-size: 17px; margin-top: 18px; max-width: 470px; }
  .v1-cta { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .v1-stage { position: relative; display: flex; justify-content: center; }
  .v1-phone { width: 250px; height: 508px; border-radius: 44px; position: relative; background: #0d0d10; border: 1px solid #2a2a30; box-shadow: 0 0 0 9px #17171b, 0 0 0 10px #303038, 0 30px 80px rgb(0 0 0 / .45); animation: v1-float 7s ease-in-out infinite; }
  @keyframes v1-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
  .v1-island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 76px; height: 21px; background: #000; border-radius: 999px; z-index: 3; }
  .v1-screen { position: absolute; inset: 5px; border-radius: 39px; overflow: hidden; background: #101014; display: flex; flex-direction: column; }
  .v1-shot { padding: 44px 14px 8px; filter: brightness(.55); }
  .v1-shot h4 { font-size: 12px; color: #9a9aa4; }
  .v1-widget { margin-top: 9px; background: #1a1a20; border: 1px solid #2a2a32; border-radius: 12px; padding: 12px; }
  .v1-widget .t { font-size: 11.5px; font-weight: 700; color: #e8e8ee; }
  .v1-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #9a9aa4; }
  .v1-row b { color: #e8e8ee; }
  .v1-row .bad { color: #f87171; }
  .v1-bar { margin-top: 10px; height: 7px; border-radius: 4px; background: #26262e; overflow: hidden; }
  .v1-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); transform-origin: left; animation: v1-fill 1s .9s var(--ease-out-quart) both; }
  @keyframes v1-fill { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  .v1-sheet { margin-top: auto; background: #1c1c22; border-radius: 18px 18px 0 0; padding: 12px 14px 24px; border-top: 1px solid #32323a; animation: v1-sheet .6s .45s var(--ease-spring) both; }
  @keyframes v1-sheet { from { transform: translateY(105%) } to { transform: none } }
  .v1-grab { width: 32px; height: 4px; border-radius: 2px; background: #4a4a52; margin: 0 auto 10px; }
  .v1-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .v1-head .c { color: #6d86ff } .v1-head .t { font-weight: 700; color: #fff; font-size: 11.5px } .v1-head .s { background: #4f6ef7; color: #fff; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
  .v1-fb { display: flex; gap: 8px; margin-top: 10px; }
  .v1-thumb { width: 38px; height: 66px; border-radius: 7px; border: 2px solid #4f6ef7; background: linear-gradient(180deg, #23232b, #1a1a20); }
  .v1-text { flex: 1; font-size: 11px; color: #d7d7de; background: #26262e; border-radius: 9px; padding: 8px 10px; line-height: 1.5; }
  .v1-cursor { display: inline-block; width: 2px; height: 11px; background: #6d86ff; vertical-align: -2px; animation: v1-blink 1.1s steps(1) infinite; }
  @keyframes v1-blink { 50% { opacity: 0 } }
  .v1-issue { position: absolute; right: -6px; bottom: 30px; width: 280px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 18px 50px rgb(0 0 0 / .35); padding: 13px 15px; animation: pop .5s 1.05s var(--ease-spring) both; }
  @media (max-width: 880px) { .v1-issue { position: static; margin: -20px auto 0 } }
  .v1-ic-top { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted-foreground); }
  .v1-dot { width: 14px; height: 14px; border-radius: 999px; background: var(--success); color: #0a0a0b; font-size: 9px; display: inline-grid; place-items: center; font-weight: 800; }
  .v1-ic-title { font-size: 13px; font-weight: 700; margin-top: 7px; }
  .v1-labels { display: flex; gap: 6px; margin-top: 9px; }
  .v1-label { font: 600 10px var(--font-mono); padding: 3px 8px; border-radius: 999px; }
  .v1-pr { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font: 11px var(--font-mono); color: var(--success); }
  .v1-pr b { color: var(--foreground); }

  /* ---------- V2 Editorial ---------- */
  .v2-hero { text-align: center; padding: 96px 0 64px; position: relative; }
  .v2-kicker { font: 600 12px var(--font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--primary); animation: rise .5s .05s var(--ease-out-quart) both; }
  .v2-hero h1 { font-size: clamp(44px, 7.2vw, 88px); line-height: .98; letter-spacing: -.045em; font-weight: 800; margin-top: 26px; }
  .v2-hero h1 .line { display: block; overflow: hidden; }
  .v2-hero h1 .line > span { display: inline-block; animation: v2-up .7s var(--ease-out-quart) both; }
  .v2-hero h1 .line:nth-child(1) > span { animation-delay: .12s }
  .v2-hero h1 .line:nth-child(2) > span { animation-delay: .22s }
  .v2-hero h1 .line:nth-child(3) > span { animation-delay: .32s; color: var(--primary); }
  @keyframes v2-up { from { transform: translateY(110%) } to { transform: none } }
  .v2-sub { color: var(--muted-foreground); font-size: 18px; max-width: 540px; margin: 30px auto 0; animation: rise .55s .45s var(--ease-out-quart) both; }
  .v2-cta { display: flex; gap: 12px; justify-content: center; margin-top: 34px; animation: rise .55s .55s var(--ease-out-quart) both; }
  .v2-trace { margin: 64px auto 0; max-width: 560px; font: 13px var(--font-mono); color: var(--muted-foreground); border-top: 1px solid var(--border); padding-top: 22px; animation: rise .6s .75s var(--ease-out-quart) both; }
  .v2-trace b { color: var(--foreground); font-weight: 600; }
  .v2-trace .ok { color: var(--success); }

  /* ---------- V3 Terminal ---------- */
  .v3-hero { padding: 64px 0 56px; text-align: center; }
  .v3-hero h1 { font-size: clamp(30px, 4.4vw, 50px); letter-spacing: -.03em; line-height: 1.08; font-weight: 800; animation: rise .55s .05s var(--ease-out-quart) both; }
  .v3-hero h1 em { font-style: normal; color: var(--primary); }
  .v3-sub { color: var(--muted-foreground); font-size: 16.5px; max-width: 560px; margin: 16px auto 0; animation: rise .55s .15s var(--ease-out-quart) both; }
  .v3-cta { display: flex; gap: 12px; justify-content: center; margin-top: 26px; animation: rise .55s .25s var(--ease-out-quart) both; }
  .v3-term { max-width: 760px; margin: 44px auto 0; background: #0d0d11; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; text-align: left; box-shadow: 0 24px 70px rgb(0 0 0 / .4); animation: pop .55s .35s var(--ease-out-quart) both; }
  .v3-bar { display: flex; align-items: center; gap: 6px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .v3-bar i { width: 10px; height: 10px; border-radius: 999px; background: #26262e; }
  .v3-bar span { margin-left: 8px; font: 11.5px var(--font-mono); color: var(--muted-foreground); }
  .v3-log { padding: 18px 20px 22px; font: 13px/1.9 var(--font-mono); }
  .v3-line { display: flex; gap: 14px; opacity: 0; animation: v3-in .35s var(--ease-out-quart) forwards; }
  @keyframes v3-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .v3-line .ts { color: #5b5b66; flex: 0 0 58px; }
  .v3-line .src { flex: 0 0 92px; color: var(--primary); }
  .v3-line .msg { color: var(--muted-foreground); }
  .v3-line .msg b { color: var(--foreground); font-weight: 600; }
  .v3-line .msg .ok { color: var(--success); }
  .v3-line .msg .warn { color: #f59e0b; }
  .v3-line:nth-child(1) { animation-delay: .6s } .v3-line:nth-child(2) { animation-delay: 1.05s }
  .v3-line:nth-child(3) { animation-delay: 1.5s } .v3-line:nth-child(4) { animation-delay: 1.95s }
  .v3-line:nth-child(5) { animation-delay: 2.4s } .v3-line:nth-child(6) { animation-delay: 2.85s }
  .v3-line:nth-child(7) { animation-delay: 3.3s }
  .v3-caret { display: inline-block; width: 7px; height: 14px; background: var(--success); vertical-align: -2px; margin-left: 4px; animation: v1-blink 1.1s steps(1) infinite; }

  @media (prefers-reduced-motion: reduce) {
    .rise, [class*="v1-"], [class*="v2-"], [class*="v3-"] { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
    .v3-line { opacity: 1 !important; }
  }

  /* ---------- Picker (PICKER.md, verbatim) ---------- */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Showroom</button>
  <button class="proto-picker-item">Editorial</button>
  <button class="proto-picker-item">Terminal</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const chrome = (inner) => `
  <div class="wrap">
    <header class="nav">
      <div class="brand">Feedback<span>Loop</span></div>
      <div class="nav-fake"><span>How it works</span><span>Pricing</span><span>FAQ</span><span>GitHub</span></div>
    </header>
    ${inner}
  </div>`

const v1 = () => chrome(`
  <section class="v1-hero">
    <div>
      <span class="v1-pill rise" style="animation-delay:.04s"><b>NEW</b> AI triage now opens fix PRs automatically</span>
      <h1 class="rise" style="animation-delay:.12s">TestFlight feedback,<br><em>triaged before you read it</em></h1>
      <p class="v1-sub rise" style="animation-delay:.2s">Every tester screenshot and crash report becomes a labeled GitHub issue. Then an AI agent root-causes it against your code and opens the fix PR.</p>
      <div class="v1-cta rise" style="animation-delay:.28s">
        <span class="btn btn-primary">Connect your app →</span>
        <span class="btn btn-outline">See how it works</span>
      </div>
    </div>
    <div class="v1-stage rise" style="animation-delay:.2s">
      <div class="v1-phone">
        <div class="v1-island"></div>
        <div class="v1-screen">
          <div class="v1-shot">
            <h4>Dashboard</h4>
            <div class="v1-widget">
              <div class="t">Technician Capacity</div>
              <div class="v1-row"><span>Total techs</span><b>8</b></div>
              <div class="v1-row"><span>On job</span><b class="bad">16</b></div>
              <div class="v1-row"><span>Utilisation</span><b class="bad">200%</b></div>
              <div class="v1-bar"><i style="width:100%"></i></div>
            </div>
          </div>
          <div class="v1-sheet">
            <div class="v1-grab"></div>
            <div class="v1-head"><span class="c">Cancel</span><span class="t">Send Beta Feedback</span><span class="s">Submit</span></div>
            <div class="v1-fb"><div class="v1-thumb"></div><div class="v1-text">The technician capacity doesn't mean or have any interactions, what is it?<span class="v1-cursor"></span></div></div>
          </div>
        </div>
      </div>
      <div class="v1-issue">
        <div class="v1-ic-top"><span class="v1-dot">✓</span> acme/field-app · issue opened 14s later</div>
        <div class="v1-ic-title">[TestFlight] Technician capacity shows 16 of 8 on job</div>
        <div class="v1-labels">
          <span class="v1-label" style="background:rgb(109 134 255 / .15);color:var(--primary)">testflight-feedback</span>
          <span class="v1-label" style="background:rgb(239 68 68 / .15);color:#ef4444">bug</span>
          <span class="v1-label" style="background:rgb(245 158 11 / .18);color:#d97706">P2</span>
        </div>
        <div class="v1-pr">✓ AI triage → <b>schedule.ts:165</b> counts tasks, not techs<br>✓ PR opened: <b>fix(widgets): count techs, not tasks</b></div>
      </div>
    </div>
  </section>`)

const v2 = () => chrome(`
  <section class="v2-hero">
    <div class="v2-kicker">TestFlight → GitHub → Fix PR</div>
    <h1>
      <span class="line"><span>Your testers found</span></span>
      <span class="line"><span>the bug. We found</span></span>
      <span class="line"><span>the line of code.</span></span>
    </h1>
    <p class="v2-sub">FeedbackLoop turns every TestFlight screenshot and crash into a triaged GitHub issue — root cause, priority, and a fix PR, before you've read the notification.</p>
    <div class="v2-cta">
      <span class="btn btn-primary">Connect your app →</span>
      <span class="btn btn-outline">Read the docs</span>
    </div>
    <div class="v2-trace">"The technician capacity doesn't mean anything?" → <b>schedule.ts:165</b> → <span class="ok">PR #2386 opened</span> · 2 minutes, no humans involved</div>
  </section>`)

const v3 = () => chrome(`
  <section class="v3-hero">
    <h1>Ship fixes at the speed<br>of <em>tester feedback</em></h1>
    <p class="v3-sub">Watch a real trace: a TestFlight shake becoming a root-caused GitHub issue with a fix PR — in under two minutes, hands-off.</p>
    <div class="v3-cta">
      <span class="btn btn-primary">Connect your app →</span>
      <span class="btn btn-outline">Self-host it</span>
    </div>
    <div class="v3-term">
      <div class="v3-bar"><i></i><i></i><i></i><span>feedbackloop · live trace</span></div>
      <div class="v3-log">
        <div class="v3-line"><span class="ts">14:32:04</span><span class="src">testflight</span><span class="msg">shake → <b>"16 of 8 technicians on job… 200% utilisation?!"</b> + screenshot</span></div>
        <div class="v3-line"><span class="ts">14:32:07</span><span class="src">apple</span><span class="msg">signed webhook delivered · <span class="ok">HMAC verified</span></span></div>
        <div class="v3-line"><span class="ts">14:32:09</span><span class="src">feedbackloop</span><span class="msg">fetched screenshots + device forensics <span class="warn">(iPhone 17, iOS 26.5, build 39)</span></span></div>
        <div class="v3-line"><span class="ts">14:32:18</span><span class="src">github</span><span class="msg">issue <b>#2384</b> opened · testflight-feedback · needs-triage</span></div>
        <div class="v3-line"><span class="ts">14:33:40</span><span class="src">ai-triage</span><span class="msg">root cause → <b>schedule.ts:165</b> counts tasks, not technicians · <b>bug · P2</b></span></div>
        <div class="v3-line"><span class="ts">14:34:02</span><span class="src">github</span><span class="msg"><span class="ok">PR #2386 opened</span> — fix(widgets): count techs, not tasks</span></div>
        <div class="v3-line"><span class="ts">14:34:02</span><span class="src">you</span><span class="msg">…were still in a meeting<span class="v3-caret"></span></span></div>
      </div>
    </div>
  </section>`)

const variants = [v1, v2, v3]

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
